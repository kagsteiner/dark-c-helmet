    <style>
      /* Same colours and type as the app (src/styles/tokens.css) and the about page. */
      :root {
        color-scheme: light dark;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --bg: #fafaf8;
        --text: #1d1d1f;
        --muted: #6b6b70;
        --hairline: rgba(0, 0, 0, 0.1);
        --accent: #2f62c6;
        --accent-text: #ffffff;
        --square-light: #eedcb9;
        --square-dark: #b88b62;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18191b;
          --text: #ececec;
          --muted: #9a9ca2;
          --hairline: rgba(255, 255, 255, 0.12);
          --accent: #6d9cf2;
          --accent-text: #0e1a33;
          --square-light: #d9c3a0;
          --square-dark: #9c7553;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 17px/1.55 var(--font);
      }
      a { color: var(--accent); }
      .page {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        max-width: 560px;
        margin: 0 auto;
        padding: 40px 16px 24px;
        text-align: center;
      }
      .title { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .title img { width: 64px; height: 64px; border-radius: 12px; }
      h1 { margin: 0; font-size: clamp(30px, 8vw, 44px); line-height: 1.1; letter-spacing: -0.02em; }
      .tagline { margin: 0; color: var(--muted); }
      .board {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        width: min(100%, 320px);
        aspect-ratio: 1;
        overflow: hidden;
        border-radius: 6px;
      }
      .board div { background: var(--square-light); }
      .board div.dark { background: var(--square-dark); }
      .board img { display: block; width: 100%; height: 100%; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
      .button {
        display: inline-block;
        min-height: 44px;
        padding: 10px 22px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-weight: 600;
        text-decoration: none;
      }
      .button.secondary { background: transparent; border-color: var(--hairline); color: var(--text); }
      footer { margin-top: auto; padding-top: 16px; font-size: 14px; color: var(--muted); }
      footer a { color: inherit; }
    </style>
  </head>

      </footer>
    </main>

      const KNIGHTS = ["NN---", "N-N--", "N--N-", "N---N", "-NN--", "-N-N-", "-N--N", "--NN-", "--N-N", "---NN"];

      function backRank(n) {
        const rank = new Array(8).fill("");
        rank[[1, 3, 5, 7][n % 4]] = "B";
        n = Math.floor(n / 4);
        rank[[0, 2, 4, 6][n % 4]] = "B";
        n = Math.floor(n / 4);
        const empty = () => rank.flatMap((p, i) => (p ? [] : [i]));
        rank[empty()[n % 6]] = "Q";
        n = Math.floor(n / 6);
        const free = empty();
        [...KNIGHTS[n]].forEach((c, i) => {
          if (c === "N") rank[free[i]] = "N";
        });
        const [r1, k, r2] = empty();
        rank[r1] = "R";
        rank[k] = "K";
        rank[r2] = "R";
        return { rank, r1, r2 };
      }

      const n = Math.floor(Math.random() * 960);
      const { rank } = backRank(n);
      const rows = [rank.map((p) => "b" + p), new Array(8).fill("bP"), ...new Array(4).fill(new Array(8).fill("")), new Array(8).fill("wP"), rank.map((p) => "w" + p)];
      const board = document.getElementById("board");
      board.setAttribute("role", "img");
      board.setAttribute("aria-label", `Chess960 start position ${n}`);
      board.innerHTML = rows
        .flatMap((row, y) => row.map((p, x) => `<div${(x + y) % 2 ? ' class="dark"' : ""}>${p ? `<img alt="" src="${PIECES[p]}">` : ""}</div>`))
        .join("");
    </script>
