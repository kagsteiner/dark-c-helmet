# nginx: serving the web app (inside the existing HTTPS server block).
# Adjust the path; for a subfolder use "location /chess/ { alias /var/www/dark-c-helmet/; ... }".
#
# Note: add_header in a nested location replaces the outer ones, so every location that
# sets headers repeats the two isolation headers.

location / {
    root /var/www/dark-c-helmet;
    index index.html;

    # Threads in the engine need SharedArrayBuffer, which needs cross-origin isolation.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # The page and the engine files have fixed names: always revalidate.
    add_header Cache-Control "no-cache" always;

    # Files with a content hash in their name never change.
    location /assets/ {
        root /var/www/dark-c-helmet;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

# Older nginx versions do not know the WebAssembly type (check /etc/nginx/mime.types).
# If "wasm" is missing there, add to the http block:  types { application/wasm wasm; }
