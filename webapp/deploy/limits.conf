# =============================================================================
# Dark C. Helmet: per-address limits (nginx http context)
# =============================================================================
# Copy to /etc/nginx/conf.d/darkhelmet-limits.conf (Ubuntu's nginx.conf includes conf.d/*.conf
# inside the http block). Only defines zones: nothing changes for the other sites until a
# location uses them (darkhelmet.eu.conf, and the /chess/api/ block of srv706843.hstgr.cloud).
#
# The zones hold client addresses in memory only (10 MB: about 160,000 addresses); nothing
# is written anywhere, and the API server still never sees an address.
# =============================================================================

# The API (sync, contributions): a device syncs at game start and end, contributes in batches.
limit_req_zone $binary_remote_addr zone=dh_api:10m rate=30r/m;

# Creating a sync code and registering a browser for contributions: rare by nature. Each
# address gets a burst of a few, then one per minute.
limit_req_zone $binary_remote_addr zone=dh_create:10m rate=1r/m;

# Open connections per address (a page load opens a handful at once).
limit_conn_zone $binary_remote_addr zone=dh_conn:10m;
