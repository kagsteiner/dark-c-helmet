# =============================================================================
# darkhelmet.eu - Dark C. Helmet at the root of its own domain
# =============================================================================
#   - the app: static files in ~/nodejs/chess (the same folder as srv706843.hstgr.cloud/chess/)
#   - /api/ -> book contributions and sync (port 3060, pm2: chess-api)
#   - www.darkhelmet.eu and plain HTTP redirect to https://darkhelmet.eu, so every visitor
#     uses one origin (browsers keep the app's data per origin)
# =============================================================================

server {
    listen 443 ssl;
    server_name darkhelmet.eu;

    ssl_certificate /etc/letsencrypt/live/darkhelmet.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkhelmet.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/agsteiner/nodejs/chess;
    index index.html;

    # The engine runs in the browser; its threads need the two Cross-Origin headers.
    location / {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache" always;
    }

    # No client addresses are passed on.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3060/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 2m;
    }
}

server {
    listen 443 ssl;
    server_name www.darkhelmet.eu;

    ssl_certificate /etc/letsencrypt/live/darkhelmet.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkhelmet.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://darkhelmet.eu$request_uri;
}

# HTTP (port 80) -> HTTPS
server {
    listen 80;
    server_name darkhelmet.eu www.darkhelmet.eu;

    if ($host = darkhelmet.eu) {
        return 301 https://darkhelmet.eu$request_uri;
    }
    if ($host = www.darkhelmet.eu) {
        return 301 https://darkhelmet.eu$request_uri;
    }

    return 404;
}
