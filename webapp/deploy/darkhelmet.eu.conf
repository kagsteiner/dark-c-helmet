# =============================================================================
# darkhelmet.eu - Dark C. Helmet at the root of its own domain
# =============================================================================
#   - the app: static files in ~/nodejs/chess (the same folder as srv706843.hstgr.cloud/chess/)
#   - /api/ -> book contributions and sync (port 3060, pm2: chess-api)
#   - www.darkhelmet.eu and plain HTTP redirect to https://darkhelmet.eu, so every visitor
#     uses one origin (browsers keep the app's data per origin)
#   - limits per client address against floods (zones in limits.conf, which goes to
#     /etc/nginx/conf.d/darkhelmet-limits.conf first)
# =============================================================================

server {
    listen 443 ssl;
    server_name darkhelmet.eu;

    ssl_certificate /etc/letsencrypt/live/darkhelmet.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkhelmet.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/agsteiner/nodejs/chess;
    index index.html;

    # Against floods and slow clients: open connections per address, short timeouts (between
    # two reads, not for the whole transfer), no version number in errors. Over a limit: 429.
    server_tokens off;
    limit_conn dh_conn 40;
    limit_conn_status 429;
    limit_req_status 429;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    # The engine files compress to about half: less to send, to everyone and to a flood.
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # The engine runs in the browser; its threads need the two Cross-Origin headers.
    # (add_header in a location replaces the server's, so all headers are here.)
    location / {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # The API (server/main.ts). No client addresses are passed on. Per address: 30 requests a
    # minute after a burst of 20; the server itself takes at most 8 at a time.
    location ^~ /api/ {
        limit_req zone=dh_api burst=20 nodelay;
        limit_conn dh_conn 10;
        proxy_pass http://127.0.0.1:3060/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 2m;
        proxy_connect_timeout 5s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # A new sync code, a new contributing browser: a few per address, then one a minute.
    location = /api/sync/create {
        limit_req zone=dh_create burst=3 nodelay;
        limit_req zone=dh_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3060/sync/create;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 2m;
        proxy_connect_timeout 5s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
    }

    location = /api/register {
        limit_req zone=dh_create burst=3 nodelay;
        limit_req zone=dh_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3060/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 16k;
        proxy_connect_timeout 5s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
    }
}

server {
    listen 443 ssl;
    server_name www.darkhelmet.eu;

    ssl_certificate /etc/letsencrypt/live/darkhelmet.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkhelmet.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://darkhelmet.eu$request_uri;
}

# HTTP (port 80) -> HTTPS
server {
    listen 80;
    server_name darkhelmet.eu www.darkhelmet.eu;

    if ($host = darkhelmet.eu) {
        return 301 https://darkhelmet.eu$request_uri;
    }
    if ($host = www.darkhelmet.eu) {
        return 301 https://darkhelmet.eu$request_uri;
    }

    return 404;
}
